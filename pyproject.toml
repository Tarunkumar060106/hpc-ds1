[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-ds1"
version = "1.0.0"
description = "Confidence-aware decision model that tunes HPC jobs on the machine it runs on"
readme = "README.md"
requires-python = ">=3.10"
# Install the CUDA build of torch for your driver first if you want GPU actions
# (https://pytorch.org/get-started/locally/); CPU-only works, GPU moves are just unavailable.
dependencies = ["torch>=2.4", "numpy>=1.26", "psutil>=5.9"]

[project.optional-dependencies]
test = ["pytest>=7"]
encoder = ["transformers>=4.48"]  # free-text questions (/v1/ask); weights from the GitHub release

[project.urls]
Homepage = "https://github.com/Tarunkumar060106/hpc-ds1"

[project.scripts]
hpc-ds1 = "hpc_ds1.__main__:main"

[tool.setuptools]
packages = ["hpc_ds1"]
